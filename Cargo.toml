[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.0.12-alpha"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoouTaro/rgrip"
homepage = "https://yoouTaro.github.io/rgrip/"
description = "A small native PostgreSQL client in Rust, with a built-in map for PostGIS data."
keywords = ["postgres", "postgis", "database", "gui", "egui"]
categories = ["database", "gui"]

# Debug builds: optimize dependencies (image decoding and SVG rendering are
# unusably slow unoptimized; the map layout preview renders tiles live).
[profile.dev.package."*"]
opt-level = 2
