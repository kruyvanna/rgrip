[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.0.8-alpha"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoouTaro/rgrip"
homepage = "https://yoouTaro.github.io/rgrip/"
description = "PostGIS, without opening QGIS. A tiny (9 MB) native PostgreSQL client in Rust that puts any query's geometry on a map."
keywords = ["postgres", "postgis", "database", "gui", "egui"]
categories = ["database", "gui"]
