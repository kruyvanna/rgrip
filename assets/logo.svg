<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- rgrip app icon: hard-edged geometric "r" on a dark tile (macOS icon grid: 824px tile, 100px margin). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B33"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <!-- One gradient in user space so stem and shoulder blend without a seam. -->
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="352" y1="330" x2="652" y2="724">
      <stop offset="0" stop-color="#B4CBFF"/>
      <stop offset="1" stop-color="#5D7BF5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  <g transform="translate(12 -14)">
    <!-- stem -->
    <rect x="352" y="330" width="136" height="394" fill="url(#glyph)"/>
    <!-- shoulder: starts inside the stem, ends in a flat vertical cut at x-height -->
    <path d="M 420 600 C 420 470 500 398 652 398" fill="none" stroke="url(#glyph)" stroke-width="136" stroke-linecap="butt"/>
  </g>
</svg>
