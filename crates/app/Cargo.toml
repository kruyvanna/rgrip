[package]
name = "rgrip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[dependencies]
rgrip-core = { path = "../core" }
# egui 0.34+ needs rustc 1.92+; 0.33 builds on 1.88.
eframe = "0.33"
egui_extras = { version = "0.33", default-features = false }
walkers = "0.52"
rfd = "0.17"
earcutr = "0.4"
rustybuzz = "0.20"
ab_glyph = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
svg2pdf = { version = "0.13", default-features = false, features = ["image", "text"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
