[package]
name = "rgrip"
version.workspace = true
edition.workspace = true

[dependencies]
rgrip-core = { path = "../core" }
# egui 0.34+ needs rustc 1.92+; 0.33 builds on 1.88.
eframe = "0.33"
egui_extras = { version = "0.33", default-features = false }
walkers = "0.52"
rfd = "0.17"
earcutr = "0.4"
rustybuzz = "0.20"
ab_glyph = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
